analysis:
  bootstrap_replicates: 1000
  min_source_rows: 20
batch_size: 256
corpus_resource: corpus
dataset_config: configs/datasets/horus_full.yaml
experiment_id: human-theme-llm-agreement-v1
llm:
  batch_size: 8
  gpu_memory_utilization: 0.85
  max_input_characters: 6000
  max_model_len: 8192
  max_output_tokens: 1024
  models:
    gemma4_31b:
      chat_template_kwargs:
        enable_thinking: false
      enforce_eager: true
      hf_repo: google/gemma-4-31B-it
      limit_mm_per_prompt:
        audio: 0
        image: 0
        video: 0
    gpt_oss_120b:
      chat_template_kwargs:
        reasoning_effort: low
      enforce_eager: false
      hf_repo: openai/gpt-oss-120b
  temperature: 0.0
manual_mapping: experiments/01_quality_audit/human_theme_validation/configs/manual_theme_map.csv
model:
  device: auto
  epochs: 3
  heldout_generator: null
  inference_batch_size: 32
  learning_rate: 2.0e-05
  max_length: 512
  name: neuralmind/bert-base-portuguese-cased
  patience: 1
  revision: 94d69c95f98f7d5b2a8700c420230ae10def0baa
  train_batch_size: 16
  weight_decay: 0.01
output_root: results/theme_llm_600
prompts: experiments/01_quality_audit/theme_agreement_600/configs/llm_prompts_v1.yaml
sampling:
  method: pilot_plus_uniform_without_replacement
  pilot_per_area: 20
  total_per_area: 100
schema_version: 1
seed: 2026
taxonomy_resource: taxonomy
threshold:
  fixed_probability: 0.95
  policy: fixed
train_resource: train
validation_resource: validation
workspace_root: ../../../..

schema_version: 1
experiment_id: horus-frozen-lm-pairs-v1
max_tokens: 512
statistics_dtype: float32
device: cuda
models:
  falcon_base: {repo_id: tiiuae/falcon-7b, revision: main, dtype: bfloat16}
  falcon_instruct: {repo_id: tiiuae/falcon-7b-instruct, revision: main, dtype: bfloat16}
  gptj: {repo_id: EleutherAI/gpt-j-6B, revision: float16, dtype: float16}
  neo: {repo_id: EleutherAI/gpt-neo-2.7B, revision: main, dtype: float16}
  qwen_base: {repo_id: Qwen/Qwen2.5-7B, revision: main, dtype: bfloat16}
  qwen_instruct: {repo_id: Qwen/Qwen2.5-7B-Instruct, revision: main, dtype: bfloat16}
  qwen_small: {repo_id: Qwen/Qwen2.5-0.5B, revision: main, dtype: bfloat16}
  qwen_medium: {repo_id: Qwen/Qwen2.5-1.5B, revision: main, dtype: bfloat16}
pairs:
  falcon:
    reference: falcon_base
    scoring: falcon_instruct
    methods: [fastdetect, binoculars]
    original_binoculars: true
  gptj_neo:
    reference: gptj
    scoring: neo
    methods: [fastdetect]
  qwen:
    reference: qwen_base
    scoring: qwen_instruct
    methods: [fastdetect, binoculars]
    adapted: true
  ghost_weak:
    reference: qwen_small
    scoring: qwen_medium
    methods: [weak_logprobs]
    adapted: true

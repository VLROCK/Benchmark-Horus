# Text-only supervised baseline for horus-n2-iid-v1.
# The revision matches the already pinned theme baseline in this repository.
# No test labels, source, generator, prompt or theme enter the model.
model:
  name: neuralmind/bert-base-portuguese-cased
  revision: 94d69c95f98f7d5b2a8700c420230ae10def0baa
  max_length: 512
  learning_rate: 0.00002
  epochs: 3
  train_batch_size: 16
  inference_batch_size: 32
  gradient_accumulation_steps: 2
  weight_decay: 0.01
  warmup_ratio: 0.10
  max_grad_norm: 1.0
  device: cuda

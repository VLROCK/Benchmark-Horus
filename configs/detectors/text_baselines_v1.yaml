schema_version: 1
experiment_id: horus-n2-text-baselines-v1
# All inputs to these models are text strings. The runner must not pass
# source, generator, theme, prompt or other metadata as features.
models:
  - surface_length
  - surface_presentation
  - surface_punctuation
  - surface_all
  - word_lr
  - char4_lr
  - char4_svm
  - human_iforest

# C is selected by nested CV inside the four training folds only.
c_grid: [0.1, 1.0, 10.0]
tfidf:
  min_df: 5
  max_df: 0.95
  max_features: 200000
  sublinear_tf: true
linear:
  lr_max_iter: 2000
  svm_max_iter: 5000
iforest:
  svd_components: 256
  n_estimators: 300
  max_samples: 4096

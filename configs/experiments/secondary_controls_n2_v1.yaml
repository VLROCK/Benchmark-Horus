schema_version: 1
experiment_id: horus-n2-secondary-controls-v1
release_dir: results/releases/horus-n2-iid-v1
prepared_dir: results/evaluation/n2-v1/prepared
split_seeds: [20261105, 20261106, 20261107]

# The same N2 log2(1 + words) cells used by selection and OOD controls.
length_bin_width: 0.25

# Presentation is a separate, stronger common-support sensitivity analysis.
# It is meaningful only for the original document unit.
paragraph_bins: [1, 5]
presentation_marker: markdown_bullet

# A diagnostic is reported only when both labels have this many rows in its
# analysis population; smaller cells remain in the membership/coverage tables.
minimum_subgroup_per_label: 20

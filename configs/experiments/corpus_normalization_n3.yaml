schema_version: 1
experiment_id: corpus-normalization-n3-presentation-trial-v1
workspace_root: ../..
dataset_config: configs/datasets/horus_full.yaml
corpus_resource: corpus
batch_size: 512
rules:
  stage: n3
  repair_mojibake: true
  replace_contacts: true
  convert_editorial_html: true
  remove_strict_terminal_footers: true
  remove_bounded_parallel_abstracts: true
  remove_strict_terminal_references: false
  guard_min_original_words: 50
  guard_min_lost_words: 20
  guard_min_retained_fraction: 0.90
  min_english_abstract_words: 40
  min_html_residual_tags_for_review: 3
  neutralize_markdown: true
  remove_explicit_placeholders: true
